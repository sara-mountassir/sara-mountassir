<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sara Mountassir - Fifth-Year Engineering Student, EMSI Casablanca">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b14"/>
      <stop offset="55%" stop-color="#141021"/>
      <stop offset="100%" stop-color="#1e1333"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#ffc2d8"/>
      <stop offset="100%" stop-color="#ff6fa5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6fa5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6fa5" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ff6fa5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="1100" cy="150" r="300" fill="url(#glow)"/>

  <!-- bicycle motif -->
  <g stroke="url(#accent)" stroke-width="3.5" fill="none" opacity="0.45" stroke-linecap="round">
    <circle cx="1012" cy="212" r="46"/>
    <circle cx="1160" cy="212" r="46"/>
    <path d="M1012 212 L1085 212"/>
    <path d="M1085 212 L1055 140"/>
    <path d="M1012 212 L1055 140"/>
    <path d="M1085 212 L1150 156"/>
    <path d="M1150 156 L1160 212"/>
    <path d="M1128 149 L1174 149"/>
    <path d="M1038 133 L1074 133"/>
  </g>
  <g fill="#ff6fa5" opacity="0.85">
    <circle cx="1012" cy="212" r="5"/>
    <circle cx="1160" cy="212" r="5"/>
    <circle cx="1085" cy="212" r="5"/>
  </g>

  <!-- name -->
  <text x="76" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="0.5" fill="url(#nameFill)">Sara Mountassir</text>
  <rect x="76" y="172" width="124" height="4" rx="2" fill="url(#accent)"/>

  <!-- subtitle -->
  <text x="76" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#cbd5e1">Fifth-Year Engineering Student &#183; Digital Development &amp; Information Systems</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.4" fill="#e7e3f5">
    <rect x="76" y="238" width="182" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <rect x="76" y="238" width="182" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="167" y="260" text-anchor="middle">EMSI &#183; CASABLANCA</text>

    <rect x="270" y="238" width="148" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <rect x="270" y="238" width="148" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="344" y="260" text-anchor="middle">SPRING BOOT</text>

    <rect x="430" y="238" width="106" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <rect x="430" y="238" width="106" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="483" y="260" text-anchor="middle">DJANGO</text>

    <rect x="548" y="238" width="154" height="34" rx="17" fill="#ffffff" opacity="0.06"/>
    <rect x="548" y="238" width="154" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="625" y="260" text-anchor="middle">MICROSERVICES</text>
  </g>

  <!-- tagline -->
  <text x="76" y="300" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.8" fill="#8b86a3">// BUILD IT &#183; TEST IT &#183; DOCUMENT IT</text>
</svg>
